repos:
  - repo: local
    hooks:
      - id: flake8
        name: Flake8 (project-wide style check)
        entry: flake8 src/ tests/ config/ main.py --max-line-length=100
        language: python
        additional_dependencies:
          - flake8==7.4.1
        pass_filenames: false
        always_run: true
        require_serial: true
