name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install pylint black flake8 mypy
        pip install -r requirements.txt

    - name: Black (formatting)
      run: black --check --line-length 100 src/ tests/ config/ main.py

    - name: Flake8 (style)
      run: flake8 src/ tests/ config/ main.py --max-line-length=100

    - name: Pylint (quality)
      run: pylint src/ config/ main.py --rcfile=.pylintrc

    - name: MyPy (types)
      run: mypy src/ config/ main.py --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Run tests
      run: pytest tests/ -v --cov=src --cov-report=xml