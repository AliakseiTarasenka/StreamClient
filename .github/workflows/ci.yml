name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install -r requirements.txt
        python -m pip check

    - name: Black (formatting)
      run: black --check --line-length 100 src/ tests/ config/ main.py

    - name: Pre-commit (Flake8)
      run: pre-commit run --all-files --show-diff-on-failure

    - name: Pylint (quality)
      run: pylint src/ config/ main.py --rcfile=.pylintrc

    - name: MyPy (types)
      run: python -m mypy src/ config/ main.py --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install -r requirements.txt pytest-asyncio
        python -m pip check

    - name: Run tests
      run: pytest tests/ -v --cov=src --cov-report=xml
